<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>沿著結論，往回檢查</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&amp;family=Noto+Sans+TC:wght@300;400;500&amp;display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#F5F2ED;color:#0A1628;font-family:'Outfit','Noto Sans TC',sans-serif}main{max-width:960px;margin:0 auto}svg{display:block;width:100%;height:auto}</style></head><body><main><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" role="img" aria-labelledby="reasoning-flow-title reasoning-flow-desc"><title id="reasoning-flow-title">沿著結論，往回檢查</title><desc id="reasoning-flow-desc">從問題與已知資料出發，檢查證據與關鍵假設，分清資料能支持什麼，再整理目前判斷與待查事項。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#162544"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7A6A3A"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#162544"/></marker></defs><rect width="960" height="344" fill="#F5F2ED"/><g font-family="'Outfit', 'Noto Sans TC', sans-serif" fill="#0A1628"><text x="40" y="40" font-size="12" font-weight="400" letter-spacing="2" fill="#7A6A3A">HC REASONING</text><text x="40" y="84" font-size="28" font-weight="300">沿著結論，往回檢查</text><line data-edge="true" x1="224" y1="184" x2="272" y2="184" stroke="#162544" marker-end="url(#arrow)"/><line data-edge="true" x1="456" y1="184" x2="504" y2="184" stroke="#162544" marker-end="url(#arrow)"/><line data-edge="true" x1="688" y1="184" x2="736" y2="184" stroke="#162544" marker-end="url(#arrow)"/><g data-node="true"><rect x="40" y="128" width="184" height="112" fill="#F5F2ED" stroke="#0A1628" stroke-width="1"/><text x="56" y="152" font-size="12" fil
